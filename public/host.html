<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PartyBox – Host</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/css/base.css">
<style>
  html,body{cursor:default}
  #lobby{position:absolute;inset:0;display:grid;grid-template-columns:30vw 1fr;gap:3vw;padding:4vh 3vw}
  .qrs{display:flex;flex-direction:column;gap:2vh}
  .qr{background:var(--panel);border-radius:2vh;padding:2vh;display:flex;gap:1.5vw;align-items:center}
  .qr .code{width:15vh;height:15vh;flex:none;border-radius:1vh;overflow:hidden;background:#fff}
  .qr .code svg{width:100%;height:100%;display:block}
  .qr b{display:block;font-size:2.4vh;margin-bottom:.4vh}
  .qr span{font-size:2vh;color:var(--muted);word-break:break-all}
  .qr .n{font-size:5vh;color:var(--accent);font-weight:800;margin-right:.5vw}
  .right{display:flex;flex-direction:column;gap:2vh;min-width:0}
  .right h1{font-size:6vh}
  .pl{display:flex;flex-wrap:wrap;gap:1vh}
  .pl .chip{font-size:2.6vh;padding:.8vh 1.8vh}
  .gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(26vw,1fr));gap:1.5vh}
  .gl .game{font-size:2.4vh;cursor:pointer}
  .gl .game .ico{font-size:5vh}
  #msg{font-size:2.6vh;color:var(--muted)}
  #stop{position:fixed;right:1vw;top:1vh;z-index:20;opacity:0;transition:opacity .3s;background:#0009}
  body:hover #stop{opacity:.9}
  #conn{position:fixed;left:50%;transform:translateX(-50%);top:1vh;z-index:20;background:var(--warn);color:#111;padding:.5vh 2vh;border-radius:9vh;font-weight:700;display:none}
  #conn.on{display:block}
</style>
</head>
<body>
<div id="app">
  <div id="conn">Reconnecting to server…</div>
  <button id="stop" hidden>✕ Back to lobby</button>

  <section id="lobby">
    <div class="qrs">
      <div class="qr"><div class="code" id="qrWifi"></div><div><b><span class="n">1</span>Join the Wi-Fi</b><span id="ssid"></span></div></div>
      <div class="qr"><div class="code" id="qrJoin"></div><div><b><span class="n">2</span>Open the game</b><span id="url"></span></div></div>
      <div class="muted" id="hostHint" style="font-size:1.8vh"></div>
    </div>
    <div class="right">
      <h1>🎉 PartyBox <span class="muted" id="count" style="font-size:3vh"></span></h1>
      <div class="pl" id="players"></div>
      <div id="msg"></div>
      <div class="gl" id="games"></div>
    </div>
  </section>
  <div id="game"></div>
</div>
<script type="module" src="/js/host.js"></script>
</body>
</html>
