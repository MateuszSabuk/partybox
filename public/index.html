<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PartyBox</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1020">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/css/base.css">
</head>
<body>
<div id="app">
  <div id="status" class="status">Reconnecting…</div>

  <section id="v-join" class="view">
    <form id="joinForm" class="center" autocomplete="off">
      <div class="logo">🎉</div>
      <h1>PartyBox</h1>
      <input id="name" maxlength="16" placeholder="Your name" autocapitalize="words" enterkeyhint="go" required>
      <div id="joinErr" class="err"></div>
      <button class="primary" type="submit">Tap to join (fullscreen)</button>
      <div id="iosHint" class="hint" hidden>For true fullscreen on iPhone: Share ▸ <b>Add to Home Screen</b>, then open PartyBox from there.</div>
    </form>
  </section>

  <section id="v-wait" class="view">
    <div class="center"><div class="logo">📡</div><h2 id="waitMsg">Connecting…</h2>
      <button id="rejoin" class="primary" hidden>Join again</button></div>
  </section>

  <section id="v-lobby" class="view">
    <div class="bar"><h2 id="meName"></h2><span class="muted" id="meScore"></span></div>
    <div class="chips" id="chips" style="margin-top:.6rem"></div>
    <h2 style="margin-top:1.2rem" id="pickTitle">Games</h2>
    <div class="games" id="games"></div>
    <div id="lobbyMsg" class="hint"></div>
    <div style="flex:1"></div>
    <button class="primary" id="startBtn" hidden>Start</button>
  </section>

  <div id="game"></div>
</div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
