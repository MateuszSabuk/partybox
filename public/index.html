<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PartyBox</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1020">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/css/base.css">
<style>
  .me{display:flex;align-items:center;gap:.9rem}
  .me .who{min-width:0;flex:1}
  .me .who h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .avbtn{position:relative;padding:0;background:none;border-radius:50%;line-height:0}
  .avbtn .badge{position:absolute;right:0;bottom:0;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--accent2);
    display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg);color:#fff}
  .avbtn .badge svg{width:62%;height:62%}
  .chip .av{margin:0 .1rem 0 0}
  .chip{padding:.2rem .75rem .2rem .25rem}
  .modal{position:fixed;inset:0;z-index:30;background:#000b;display:flex;padding:1rem}
  .modal[hidden]{display:none}
  .sheet{background:var(--panel);width:100%;max-width:26rem;margin:auto;border-radius:22px;padding:1.1rem;display:flex;flex-direction:column;gap:.7rem}
  .sheet .row{display:flex;gap:.6rem}.sheet .row>*{flex:1}
  .sheet label.btn{display:block;text-align:center;border-radius:14px;padding:.9rem 1.2rem;background:var(--panel2);cursor:pointer}
  .sheet label.btn.primary{background:linear-gradient(135deg,var(--accent),#e8412b);font-weight:700}
  #stage{position:relative;width:min(76vw,46vh,22rem);aspect-ratio:1;margin:.3rem auto;border-radius:50%;overflow:hidden;
    background:#000;touch-action:none;cursor:grab;box-shadow:0 0 0 4px var(--accent2)}
  #stage img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;pointer-events:none;-webkit-user-drag:none}
  #zoom{accent-color:var(--accent);padding:0;border:0;background:none}
  .toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translate(-50%,200%);z-index:40;
    background:#fff;color:#111;padding:.6rem 1rem;border-radius:99px;font-weight:600;transition:transform .25s;max-width:90vw;text-align:center}
  .toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <div id="status" class="status">Reconnecting…</div>

  <section id="v-join" class="view">
    <form id="joinForm" class="center" autocomplete="off">
      <div class="logo" data-icon="logo" style="font-size:4.5rem"></div>
      <h1>PartyBox</h1>
      <input id="name" maxlength="16" placeholder="Your name" autocapitalize="words" enterkeyhint="go" required>
      <div id="joinErr" class="err"></div>
      <button class="primary" type="submit">Tap to join (fullscreen)</button>
      <div class="hint">You can add a photo once you're in.</div>
      <div id="iosHint" class="hint" hidden>For true fullscreen on iPhone: Share, then <b>Add to Home Screen</b>, and open PartyBox from there.</div>
    </form>
  </section>

  <section id="v-wait" class="view">
    <div class="center"><div class="logo" data-icon="wifi" style="font-size:3.5rem;color:var(--muted)"></div><h2 id="waitMsg">Connecting…</h2>
      <button id="rejoin" class="primary" hidden>Join again</button></div>
  </section>

  <section id="v-lobby" class="view">
    <div class="me">
      <button id="meAv" class="avbtn" aria-label="Change your photo"></button>
      <div class="who"><h2 id="meName"></h2><span class="muted" id="meScore"></span></div>
    </div>
    <div class="muted" style="font-size:.85rem;margin:.5rem 0 0">Tap your picture to add or change your photo.</div>
    <div class="chips" id="chips" style="margin-top:.8rem"></div>
    <h2 style="margin-top:1.2rem" id="pickTitle">Games</h2>
    <div class="games" id="games"></div>
    <div id="lobbyMsg" class="hint"></div>
    <div style="flex:1"></div>
    <button class="primary" id="startBtn" hidden>Start</button>
  </section>

  <div id="game"></div>
</div>

<!-- photo menu -->
<div id="avSheet" class="modal" hidden>
  <div class="sheet">
    <h2>Your photo</h2>
    <label class="btn primary" for="file">Choose or take a photo</label>
    <button id="avRemove" type="button">Remove photo (use silhouette)</button>
    <button id="avClose" type="button">Close</button>
  </div>
</div>
<input id="file" type="file" accept="image/*" hidden>

<!-- framing dialog -->
<div id="crop" class="modal" hidden>
  <div class="sheet">
    <h2>Frame your photo</h2>
    <div id="stage"><img id="cropImg" alt="" draggable="false"></div>
    <div class="muted" style="text-align:center;font-size:.85rem">Drag to move, pinch or use the slider to zoom.</div>
    <input id="zoom" type="range" min="1" max="4" step="0.01" value="1" aria-label="Zoom">
    <div class="row"><button id="cropCancel" type="button">Cancel</button><button id="cropSave" type="button" class="primary">Use photo</button></div>
  </div>
</div>
<div id="toast" class="toast" role="status"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
